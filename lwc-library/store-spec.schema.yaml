# =============================================================================
# SUPERSEDED — use schema/engagement.schema.json (ADR 0002).
# Kept only until the Python Frame Agent is retired in Phase 2.
# =============================================================================
# LWC STORE SPEC — LEGACY SCHEMA
# Version: 1.0.0
# =============================================================================
#
# Every client engagement starts here. The Frame Agent reads a plain-language
# brief, asks clarifying questions, and produces a filled-in version of this
# file as store-spec.yaml in the client project directory.
#
# The Frame Agent BLOCKS delivery and outputs a human-readable exit message
# if any exit trigger fires. Exit triggers are non-negotiable.
#
# Once approved by the consultant, this file drives:
#   - Tier classification (S / M / L)
#   - Commerce Agent (market + locale + tax + payment config)
#   - Theme Agent (component list + brand tokens)
#   - QA Agent (test checklist)
# =============================================================================

# -----------------------------------------------------------------------------
# 1. CLIENT IDENTITY
# -----------------------------------------------------------------------------
client:
  name: ""                    # Legal brand name
  slug: ""                    # URL-safe short name, e.g. "bucherer"
  industry: ""                # e.g. "luxury-watches", "fashion", "homeware"
  hq_country: ""              # ISO 3166-1 alpha-2, e.g. "CH"
  shopify_plan: ""            # basic | shopify | advanced | plus
  existing_store: false       # true = migration; false = greenfield
  existing_store_url: ""      # if migration, current URL

# -----------------------------------------------------------------------------
# 2. TIER CLASSIFICATION (set by Frame Agent — do not manually override)
# -----------------------------------------------------------------------------
tier:
  selected: ""                # starter | medium | large
  price_band_chf: ""          # 45000-70000 | 70000-100000 | 100000-150000
  rationale: ""               # Frame Agent justification sentence

# -----------------------------------------------------------------------------
# 3. MARKETS & INTERNATIONALISATION
# -----------------------------------------------------------------------------
markets:
  count: 1                    # Number of Shopify Markets
  primary_market: "CH"        # ISO 3166-1 alpha-2

  # Each entry: { code, currency, languages[], price_adjustment_pct }
  market_list:
    - code: "CH"
      currency: "CHF"
      languages: ["de", "fr", "it"]
      price_adjustment_pct: 0

  # Exit trigger: markets.count > 5 → exits to programme
  # Exit trigger: total language count > 6 → exits to programme

  # Shopify Markets vs expansion stores decision
  # Use Shopify Markets when: same brand, same catalogue, price adjustments only
  # Use expansion stores when: separate legal entity, separate catalogue, separate checkout
  strategy: "shopify_markets"   # shopify_markets | expansion_stores | hybrid

# -----------------------------------------------------------------------------
# 4. CATALOGUE
# -----------------------------------------------------------------------------
catalogue:
  product_count_estimate: 0   # Rough SKU count
  variant_options_max: 1      # Max number of variant option types per product
                               # Exit trigger: > 3 → architecture review required
  variants_per_product_max: 1  # Max variants on a single product
                               # Exit trigger: > 100 → architecture review required

  # Product types present in the catalogue.
  # Valid values: simple | variant | bundle | product_set | gift_card |
  #               digital | subscription | pre_order | made_to_order | virtual
  # Exit trigger: 4+ app-backed product types → integration count review
  product_types: []           # e.g. ["simple", "variant", "bundle"]

  has_bundles: false          # Derived from product_types — kept for backwards compat
  has_subscriptions: false    # Exit trigger if true AND no app selected → flag
  subscription_app: ""        # shopify_subscriptions | recharge | bold_subscriptions
  has_digital_products: false
  has_b2b: false              # Exit trigger: b2b with RFQ → exits to composable
  has_preorders: false
  has_made_to_order: false    # Requires T3 scoping — Checkout Extensibility or draft orders

  collections_estimate: 0
  metafield_namespaces: []    # e.g. ["product.care", "product.materials"]

# -----------------------------------------------------------------------------
# 5. PAYMENTS & CHECKOUT
# -----------------------------------------------------------------------------
payments:
  provider: "shopify_payments"  # shopify_payments | adyen | stripe | other
  adyen_mid: ""                  # Adyen merchant ID if applicable
  currencies: ["CHF"]            # All accepted currencies
  local_methods:                 # Swiss-specific
    twint: false
    postfinance: false
    invoice: false               # Buy-now-pay-later / Rechnung

  checkout_type: "shopify_hosted"  # shopify_hosted | custom_checkout
  # Exit trigger: custom_checkout + budget < 150k → architecture review

  checkout_extensions: []      # List of Shopify checkout extensions needed

# -----------------------------------------------------------------------------
# 6. CUSTOM INTEGRATIONS
# -----------------------------------------------------------------------------
integrations:
  count: 0                     # Exit trigger: > 3 → exits to bespoke quote
  list:
    # Each entry: { name, type, direction, notes }
    # type: erp | crm | pim | loyalty | reviews | search | analytics | other
    # direction: inbound | outbound | bidirectional
    []

# -----------------------------------------------------------------------------
# 7. PROMOTIONS & LOYALTY
# -----------------------------------------------------------------------------
promotions:
  # Discount types in use. Valid values:
  # percentage | fixed_amount | bogo | free_shipping | volume_tiered |
  # automatic | code_based | flash_sale | pos_only
  # Native (no app): percentage, fixed_amount, bogo, free_shipping, automatic, code_based
  # App-required (+1 integration each): volume_tiered, flash_sale
  discount_types: []          # e.g. ["percentage", "code_based", "automatic"]
  stackable_discounts: false  # true → verify Shopify 2024+ config or T3 discount function

  coupon_config:
    enabled: false
    coupon_type: ""           # single-use | multi-use | bulk-csv
    branded_codes: false      # true = merchant-defined names (WELCOME20)
    codes_expire: false

  loyalty:
    app: ""                   # smile.io | loyaltylion | yotpo-loyalty | null
    components: []            # points_per_purchase | points_per_action | tiers |
                              # referral | store_credit | vip_access
    referral_bundled: true    # false = separate referral app (+1 integration)

  gift_cards:
    sold_as_product: false    # Gift card available to purchase in storefront
    issued_as_reward: false   # Gift card issued by brand (loyalty / refund / compensation)

  affiliate:
    enabled: false
    app: ""                   # refersion | uppromote | shareasale | impact | null

  shopify_collabs: false      # Influencer seeding via native Shopify Collabs

  campaign:
    esp_triggered: false      # Promotions coordinated / triggered from ESP
    landing_pages: false      # Dedicated campaign landing pages needed
    countdown_timers: false   # Urgency elements on PDP or at checkout
    by_market: false          # Different promotions per market / region

# -----------------------------------------------------------------------------
# 8. APPS (Shopify App Store)
# -----------------------------------------------------------------------------
apps:
  reviews: ""           # e.g. "judge.me", "yotpo", ""
  search: ""            # e.g. "searchie", "boost-commerce", ""
  loyalty: ""           # e.g. "smile.io", "yotpo-loyalty", ""
  subscriptions: ""     # e.g. "recharge", "bold-subscriptions", ""
  wishlist: ""
  upsell: ""
  analytics: ""         # e.g. "triple-whale", "northbeam", ""
  cookie_consent: ""    # Required for CH/EU: e.g. "pandectes", "consentmo"
  custom: []            # Any app not in the above categories

# -----------------------------------------------------------------------------
# 8. BRAND & DESIGN
# -----------------------------------------------------------------------------
brand:
  feel: "luxury"         # luxury | modern | playful
  primary_font: ""       # Google Font name or "custom" if brand font supplied
  secondary_font: ""
  accent_colour_hex: ""  # Primary brand colour
  background_hex: ""     # Default page background
  foreground_hex: ""     # Default body text colour
  logo_format: ""        # svg | png | webp
  has_brand_guidelines: false
  guidelines_url: ""

  # Radius preset (Frame Agent sets based on brand.feel)
  radius_preset: "sharp"  # sharp (0px) | soft (4-8px) | round (12px+)

# -----------------------------------------------------------------------------
# 9. COMPONENT LIST (set by Theme Agent based on tier + requirements)
# -----------------------------------------------------------------------------
components:
  # Starter baseline (always included)
  header: true
  footer: true
  hero_banner: true
  product_card: true
  collection_grid: true
  pdp_media: true
  pdp_details: true
  cart_drawer: true
  search_overlay: true

  # Medium additions
  mega_nav: false
  promo_banner: false
  brand_story: false
  newsletter: false
  recently_viewed: false
  currency_switcher: false      # Required if markets.count > 1
  language_switcher: false      # Required if total languages > 1

  # Large additions
  category_showcase: false
  lookbook: false
  press_logos: false
  video_hero: false
  custom_components: []         # Free-text list for Large tier bespoke components

# -----------------------------------------------------------------------------
# 10. PAGES & TEMPLATES
# -----------------------------------------------------------------------------
templates:
  home: true
  pdp: true           # Product Detail Page
  plp: true           # Product Listing Page (collection)
  cart: true
  account: true
  blog: false
  article: false
  faq: false
  about: false
  contact: false
  custom: []

# -----------------------------------------------------------------------------
# 11. SEO & ANALYTICS
# -----------------------------------------------------------------------------
seo:
  ga4_measurement_id: ""
  gtm_container_id: ""
  meta_pixel_id: ""
  shopify_analytics: true
  sitemap: true
  canonical_urls: true
  hreflang: true              # Automatically true if markets.count > 1

# -----------------------------------------------------------------------------
# 12. TIMELINE & DELIVERY
# -----------------------------------------------------------------------------
delivery:
  kickoff_date: ""            # ISO 8601
  target_launch_date: ""
  grow_retainer_signed: false  # MUST be true before Medium/Large delivery starts
  grow_retainer_months: 0      # Minimum 12 for discounted tier pricing

# -----------------------------------------------------------------------------
# 13. EXIT TRIGGERS (evaluated by Frame Agent — READ ONLY after Frame Agent runs)
# -----------------------------------------------------------------------------
# If any trigger fires, Frame Agent halts and outputs a plain-language exit message.
# The consultant must resolve before any build work begins.
exits:
  triggered: false
  reasons: []

# Exit conditions (hardcoded in Frame Agent — listed here for documentation):
#
#   STOP — exit to Scale programme:
#     - client.shopify_plan != "plus" AND tier.selected == "large"
#     - markets.count > 5
#     - total languages > 6
#
#   STOP — exit to composable / different platform:
#     - catalogue.has_b2b == true AND b2b requires RFQ workflow
#     - payments.checkout_type == "custom_checkout"
#     - catalogue.variant_options_max > 3
#     - catalogue.variants_per_product_max > 100
#
#   STOP — exit to bespoke quote:
#     - integrations.count > 3
#     - catalogue.has_subscriptions AND no subscriptions app selected
#     - (count of app-backed product_types + promotion apps) > 3
#
#   FLAG — architecture review required (does not block, raises for human decision):
#     - markets.strategy == "expansion_stores"
#     - catalogue.has_bundles == true
#     - catalogue.has_made_to_order == true
#     - promotions.stackable_discounts == true (verify Shopify 2024+ config or T3 work)
#     - delivery.grow_retainer_signed == false (warning on Medium/Large)
