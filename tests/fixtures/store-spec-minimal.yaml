# tests/fixtures/store-spec-minimal.yaml
# Minimal single-market starter store spec — triggers only always-on stories.
# Expected applicable stories (11):
#   store-favicon-meta, store-announcement-bar, store-footer-navigation,
#   store-cookie-consent, catalogue-collection-filtering,
#   checkout-payment-gateway-config, checkout-order-confirmation-email,
#   theme-performance-audit, theme-accessibility-audit,
#   theme-back-in-stock, integrations-analytics-ga4

store:
  name: Simple Shop
  slug: simple-shop
  industry: general
  primaryMarketCountry: US
  defaultLocale: en
  defaultCurrency: USD
  shopifyPlan: basic
  existingStore: false

tier:
  selected: starter
  rationale: Single market, no extras

markets:
  count: 1
  primaryMarket: US
  strategy: primary
  marketList: []

catalogue:
  productTypes: [general]
  maxVariants: 5
  hasBundles: false
  hasDigitalProducts: false
  hasSubscriptions: false
  hasPreorders: false
  b2bWholesale: false
  metafields: []

promotions:
  types: []
  stackingAllowed: false
  strictScheduling: false

checkout:
  paymentGateways: [shopify_payments]
  expressCheckout: false
  giftCards: false
  b2bNetTerms: false

theme:
  baseTheme: dawn
  customSections: false
  brandTokens: false

integrations:
  erp: ~
  crm: ~
  loyalty: ~
  reviews: ~
  search: ~
  analytics: ~
