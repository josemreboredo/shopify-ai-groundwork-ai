# tests/fixtures/store-spec-full.yaml
# Full-featured store spec — triggers all 36 story applicability guards.
# Used by unit and integration tests.

store:
  name: Acme Fashion
  slug: acme-fashion
  industry: fashion
  primaryMarketCountry: DE
  defaultLocale: en
  defaultCurrency: EUR
  shopifyPlan: plus
  existingStore: false

tier:
  selected: large
  rationale: Multi-market, B2B, subscriptions, and custom integrations

markets:
  count: 3
  primaryMarket: DE
  strategy: subfolder
  marketList:
    - code: DE
      currency: EUR
      languages: [de, en]
    - code: FR
      currency: EUR
      languages: [fr, en]
    - code: US
      currency: USD
      languages: [en]

catalogue:
  productTypes: [apparel, accessories]
  maxVariants: 100
  hasBundles: true
  hasDigitalProducts: true
  hasSubscriptions: true
  hasPreorders: true
  b2bWholesale: true
  metafields: [material, care_instructions, fit_guide]

promotions:
  types: [percentage, fixed_amount, gift-with-purchase]
  stackingAllowed: true
  strictScheduling: true

checkout:
  paymentGateways: [shopify_payments, paypal, klarna]
  expressCheckout: true
  giftCards: true
  b2bNetTerms: true

theme:
  baseTheme: horizon
  customSections: true
  brandTokens: true

integrations:
  erp: SAP
  crm: Salesforce
  loyalty: Smile.io
  reviews: Okendo
  search: Searchanise
  analytics: GA4
